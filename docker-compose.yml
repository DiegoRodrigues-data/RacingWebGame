# Serviços de apoio para desenvolvimento com Postgres e Redis reais (opcional: sem eles a API usa PGlite + memória).
#   docker compose up -d
#   DATABASE_URL=postgres://tracado:tracado@localhost:5432/tracado REDIS_URL=redis://localhost:6379 pnpm dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracado
      POSTGRES_PASSWORD: tracado
      POSTGRES_DB: tracado
    ports: ['5432:5432']
    volumes: [pgdata-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracado']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redis-dev:/data]
volumes:
  pgdata-dev:
  redis-dev:
